<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Producto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="main-container">
        <h1>Formulario de Producto</h1>
        <br>
        <br>
        
        <form id="formProducto">
            <div class="row">
                <div class="field">
                    <label>Código</label>
                    <input type="text" id="codigo" placeholder="PRD001K">
                </div>
                <div class="field">
                    <label>Nombre</label>
                    <input type="text" id="nombre" placeholder="Set Comedor">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Bodega</label>
                    <select id="bodega">
                        <option value="">Seleccione Bodega</option>
                    </select>
                </div>
                <div class="field">
                    <label>Sucursal</label>
                    <select id="sucursal" disabled>
                        <option value="">Seleccione Sucursal</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Moneda</label>
                    <select id="moneda">
                        <option value="">Seleccione Moneda</option>
                    </select>
                </div>
                <div class="field">
                    <label>Precio</label>
                    <input type="text" id="precio" placeholder="1500">
                </div>
            </div>

            <div class="full-row">
                <label>Material del Producto</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="material" value="Plástico"> Plástico</label>
                    <label><input type="checkbox" name="material" value="Metal"> Metal</label>
                    <label><input type="checkbox" name="material" value="Madera"> Madera</label>
                    <label><input type="checkbox" name="material" value="Vidrio"> Vidrio</label>
                    <label><input type="checkbox" name="material" value="Textil"> Textil</label>
                </div>
            </div>

            <div class="full-row">
                <label>Descripción</label>
                <textarea id="descripcion" rows="3"></textarea>
            </div>

            <div class="button-container">
                <button type="button" id="btnGuardar">Guardar Producto</button>
            </div>
        </form>
    </div>


</body>
</html>
